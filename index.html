<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pixel Adventure</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#101827;color:#fff;font-family:monospace;display:flex;min-height:100vh;align-items:center;justify-content:center;overflow:hidden}
#wrap{width:min(100vw,900px);padding:12px;text-align:center}
h1{margin:4px 0 8px;color:#ffe66d;font-size:clamp(20px,5vw,32px);text-shadow:3px 3px #813d9c}
#hud{display:flex;justify-content:space-between;margin:6px auto;max-width:800px;font-size:14px}
canvas{width:100%;height:auto;max-height:65vh;image-rendering:pixelated;border:4px solid #fff;border-radius:5px;background:#79d7ff;box-shadow:0 8px 0 #26344c;touch-action:none}
#help{font-size:12px;color:#cbd5e1;margin:10px}
.controls{display:flex;justify-content:space-between;max-width:800px;margin:10px auto 0;gap:12px}
.group{display:flex;gap:10px}
button{font: bold 14px monospace;color:#fff;background:#334155;border:3px solid #94a3b8;border-radius:10px;min-width:54px;min-height:50px;padding:4px;box-shadow:0 4px 0 #0b1220;touch-action:none}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #0b1220;background:#64748b}
#restart{font-size:12px;min-width:54px;background:#7c3aed} #hit{background:#b91c1c} #fuga{background:#ea580c} #domain{background:#6d28d9;min-width:68px} #domain.ready{background:#16a34a;box-shadow:0 0 12px #facc15}
</style>
</head>
<body>
<div id="wrap">
<h1>★ PIXEL ADVENTURE ★</h1>
<div id="hud"><span id="score">KOIN: 0/5</span><span id="status">KALAHKAN MUSUH & AMBIL KOIN!</span><span id="lives">NYAWA: 3</span></div>
<canvas id="game" width="400" height="240"></canvas>
<div id="help">PC: A/D bergerak, SPACE lompat, J HIT, K FUGA, L DOMAIN. HP: gunakan tombol di bawah. Kumpulkan koin untuk mengisi ulti!</div>
<div class="controls">
 <div class="group"><button id="left">◀</button><button id="right">▶</button></div>
 <div class="group"><button id="jump">▲ LOMPAT</button><button id="restart">ULANG</button></div>
</div>
</div>
<script>
(() => {
const c=document.getElementById('game'),ctx=c.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=400,H=240,keys={};
let player,coins,score,lives,won,dead,platforms,enemies,shots,explosions;
let domainCharge,domainCooldown,hitFlash,fugaCooldown;
platforms=[
{x:0,y:210,w:400,h:30},{x:65,y:170,w:65,h:9},{x:165,y:140,w:65,h:9},
{x:270,y:110,w:65,h:9},{x:335,y:185,w:65,h:9}
];
function reset(){
 player={x:20,y:180,w:14,h:20,vx:0,vy:0,on:false,inv:0,facing:1};
 coins=[{x:90,y:151},{x:190,y:121},{x:295,y:91},{x:360,y:165},{x:350,y:195}];
 enemies=[
  {type:'SLIME',x:125,y:190,w:16,h:16,hp:2,min:105,max:155,v:0.55},
  {type:'SLIME',x:245,y:190,w:16,h:16,hp:2,min:215,max:265,v:0.65},
  {type:'NAGA',x:315,y:82,w:28,h:24,hp:5,min:275,max:355,v:0.8}
 ];
 score=0;lives=3;won=false;dead=false;shots=[];explosions=[];
 domainCharge=0;domainCooldown=0;hitFlash=0;fugaCooldown=0;
 updateHud();
}
function updateHud(){
 document.getElementById('score').textContent='KOIN: '+score+'/5';
 document.getElementById('lives').textContent='NYAWA: '+lives;
 document.getElementById('status').textContent=won?'MENANG! 🎉':dead?'GAME OVER':'ULTI: '+Math.floor(domainCharge)+'%';
 const b=document.getElementById('domain');
 b.textContent=domainCharge>=100?'DOMAIN READY':'DOMAIN '+Math.floor(domainCharge)+'%';
 b.classList.toggle('ready',domainCharge>=100);
}
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function text(t,x,y,size=8,color='#fff'){ctx.fillStyle=color;ctx.font='bold '+size+'px monospace';ctx.textAlign='center';ctx.fillText(t,x,y)}
function draw(){
 ctx.clearRect(0,0,W,H);rect(0,0,W,H,'#79d7ff');rect(0,190,W,50,'#5ac85a');
 for(let i=0;i<5;i++){let x=(i*97)%460-30;rect(x,28,30,8,'#fff');rect(x+8,20,20,8,'#fff')}
 for(let i=0;i<6;i++){let x=i*85;rect(x,175,55,20,'#55ad78');rect(x+12,165,30,10,'#55ad78')}
 platforms.forEach(p=>{rect(p.x,p.y,p.w,p.h,'#8b5a2b');rect(p.x,p.y,p.w,4,'#35a853');for(let x=p.x+8;x<p.x+p.w;x+=16)rect(x,p.y+8,4,3,'#bd8648')});
 coins.forEach(o=>{rect(o.x-3,o.y-6,6,12,'#ffb703');rect(o.x-1,o.y-4,2,8,'#fff08a')});
 // enemies
 enemies.forEach(e=>{
  if(e.type==='SLIME'){rect(e.x,e.y+5,16,11,'#39d353');rect(e.x+3,e.y+2,10,5,'#39d353');rect(e.x+4,e.y+7,2,2,'#102');rect(e.x+11,e.y+7,2,2,'#102')}
  else {rect(e.x+5,e.y+7,18,15,'#a855f7');rect(e.x+2,e.y+2,8,9,'#7e22ce');rect(e.x+17,e.y+2,8,9,'#7e22ce');rect(e.x+8,e.y+11,3,3,'#ff3030');rect(e.x+17,e.y+11,3,3,'#ff3030');rect(e.x+10,e.y+20,4,4,'#6d28d9');rect(e.x+18,e.y+20,4,4,'#6d28d9')}
  rect(e.x,e.y-5, e.type==='NAGA'?28:16,3,'#222');rect(e.x,e.y-5,(e.type==='NAGA'?28:16)*Math.max(0,e.hp)/(e.type==='NAGA'?5:2),3,'#ef4444');
 });
 // fire projectiles
 shots.forEach(s=>{rect(s.x-4,s.y-4,8,8,'#ff7b00');rect(s.x-2,s.y-2,4,4,'#fff28a');rect(s.x-7,s.y+2,3,3,'#ef4444')});
 explosions.forEach(a=>{ctx.globalAlpha=Math.max(0,a.life/18);rect(a.x-a.r,a.y-a.r,a.r*2,a.r*2,'#ff5a00');rect(a.x-a.r/2,a.y-a.r/2,a.r,a.r,'#ffe066');ctx.globalAlpha=1});
 rect(382,165,3,45,'#f8fafc');rect(385,165,12,9,'#ef4444');
 if(player.inv%8<5){let x=player.x,y=player.y;rect(x+3,y,8,6,'#f2c18d');rect(x+2,y+6,10,8,'#2563eb');rect(x,y+14,5,6,'#273449');rect(x+9,y+14,5,6,'#273449');rect(x+8,y+2,2,2,'#111827')}
 if(hitFlash>0){ctx.globalAlpha=.45;rect(0,0,W,H,'#ef4444');ctx.globalAlpha=1}
 if(won||dead){rect(70,85,260,65,'#111827');text(won?'KAMU MENANG!':'GAME OVER',200,112,18);text('Tekan ULANG untuk bermain lagi',200,132,9)}
}
function damageEnemy(e,dmg){e.hp-=dmg;if(e.hp<=0){enemies=enemies.filter(x=>x!==e);domainCharge=Math.min(100,domainCharge+15)}}
function attack(){
 if(won||dead)return;
 let hit=false;
 enemies.slice().forEach(e=>{
  let dx=(e.x+e.w/2)-(player.x+player.w/2),dy=Math.abs((e.y+e.h/2)-(player.y+player.h/2));
  if(Math.abs(dx)<31&&dy<30&&Math.sign(dx)===player.facing){damageEnemy(e,1);hit=true}
 });
 hitFlash=hit?5:0;
}
function castFuga(){
 if(fugaCooldown>0||won||dead)return;
 fugaCooldown=45;shots.push({x:player.x+player.w/2+player.facing*9,y:player.y+8,v:player.facing*3.5});
}
function castDomain(){
 if(domainCharge<100||won||dead)return;
 domainCharge=0;domainCooldown=1;
 // domain expansion: wide slashing zone that damages all enemies
 explosions.push({x:player.x+7,y:player.y+8,r:100,life:18});
 enemies.slice().forEach(e=>damageEnemy(e,3));
 hitFlash=12;
}
function update(){
 if(!won&&!dead){
  const left=keys.left||keys.a||keys.ArrowLeft,right=keys.right||keys.d||keys.ArrowRight;
  player.vx=left?-2.1:right?2.1:0;if(player.vx)player.facing=player.vx>0?1:-1;
  player.x+=player.vx;player.vy+=.38;player.y+=player.vy;player.on=false;
  platforms.forEach(p=>{if(player.vy>=0&&player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h-player.vy<=p.y+5){player.y=p.y-player.h;player.vy=0;player.on=true}});
  if((keys.jump||keys[' ']||keys.ArrowUp)&&player.on){player.vy=-7.3;player.on=false}
  player.x=Math.max(0,Math.min(W-player.w,player.x));
  coins=coins.filter(o=>{if(Math.abs((player.x+7)-o.x)<12&&Math.abs((player.y+10)-o.y)<15){score++;domainCharge=Math.min(100,domainCharge+8);return false}return true});
  enemies.forEach(e=>{e.x+=e.v;if(e.x<e.min||e.x+e.w>e.max)e.v*=-1});
  shots.forEach(s=>{
   s.x+=s.v;
   let target=enemies.find(e=>s.x>e.x-5&&s.x<e.x+e.w+5&&s.y>e.y-5&&s.y<e.y+e.h+5);
   if(target){let ex=target.x+target.w/2,ey=target.y+target.h/2;explosions.push({x:ex,y:ey,r:22,life:18});enemies.slice().filter(e=>Math.abs(e.x-ex)<32&&Math.abs(e.y-ey)<32).forEach(e=>damageEnemy(e,3));s.dead=true}
   if(s.x<0||s.x>W)s.dead=true;
  });
  shots=shots.filter(s=>!s.dead);
  explosions.forEach(a=>{a.life--;a.r=Math.min(a.r+2,38)});explosions=explosions.filter(a=>a.life>0);
  if(player.y>H){lives--;if(lives<=0)dead=true;else{player.x=20;player.y=170;player.vy=0;player.inv=40}}
  if(player.inv>0)player.inv--;
  if(hitFlash>0)hitFlash--;
  if(fugaCooldown>0)fugaCooldown--;
  if(enemies.length===0)domainCharge=Math.min(100,domainCharge+.12);
  if(score===5&&player.x>365)won=true;
  updateHud();
 }
 draw();requestAnimationFrame(update);
}
function bind(id,k){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))}
bind('left','left');bind('right','right');bind('jump','jump');
document.getElementById('hit').addEventListener('pointerdown',e=>{e.preventDefault();attack()});
document.getElementById('fuga').addEventListener('pointerdown',e=>{e.preventDefault();castFuga()});
document.getElementById('domain').addEventListener('pointerdown',e=>{e.preventDefault();castDomain()});
document.getElementById('restart').onclick=reset;
window.addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='j')attack();if(e.key.toLowerCase()==='k')castFuga();if(e.key.toLowerCase()==='l')castDomain()});
window.addEventListener('keyup',e=>keys[e.key]=false);
reset();update();
})();
</script>
</body>
</html>
